<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broneeringud</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Broneeringud</p>
          <h1>Teenuste ajakava</h1>
        </div>

      </header>

      <main>
        <section class="service-picker" aria-labelledby="serviceHeading">
          <div class="section-heading">
            <h2 id="serviceHeading">Broneeringute tüübid</h2>
            <p>Vali teenus, et näha selle aegu</p>
          </div>
          <div class="service-grid" id="serviceGrid" aria-label="Broneeringute tüübid"></div>
        </section>

        <div class="stats" id="stats">Laen broneeringuid...</div>

        <div class="table-wrap">
          <table id="bookingTable">
            <thead>
              <tr>
                <th>Klient</th>
                <th>Teenus</th>
                <th>Kuupäev</th>
                <th>Kellaaeg</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
