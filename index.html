<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broneeringud</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Broneeringud</p>
          <h1>Teenuste ajakava</h1>
        </div>

      </header>

      <main>
        <section class="service-picker" aria-labelledby="serviceHeading">
          <div class="section-heading">
            <h2 id="serviceHeading">Broneeringute tüübid</h2>
            <p>Vali teenus, et näha selle aegu</p>
          </div>
          <div class="service-grid" id="serviceGrid" aria-label="Broneeringute tüübid"></div>
        </section>

        <div class="stats" id="stats">Laen broneeringuid...</div>

        <div class="table-wrap">
          <table id="bookingTable">
            <thead>
              <tr>
                <th>Klient</th>
                <th>Teenus</th>
                <th>Kuupäev</th>
                <th>Kellaaeg</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>
    </div>

    <dialog class="care-dialog" id="careDialog" aria-labelledby="careDialogTitle">
      <button class="care-dialog-close" type="button" aria-label="Sulge aken">&times;</button>
      <svg class="care-illustration" viewBox="0 0 240 190" role="img" aria-labelledby="careIllustrationTitle">
        <title id="careIllustrationTitle">Naeratav multikastiilis neiu</title>
        <path d="M36 190c5-39 31-62 84-62s79 23 84 62" fill="#ed9b70" />
        <path d="M58 92c-8-41 14-74 61-74s72 31 64 78l-7 44H64z" fill="#41352f" />
        <path d="M82 72c0-27 14-42 38-42s39 16 39 43v36c0 27-17 45-39 45s-38-18-38-45z" fill="#f3c39f" />
        <path d="M80 77c-8-31 6-59 35-63 28-4 58 11 65 45-18-4-32-17-39-31-10 21-33 35-61 36z" fill="#41352f" />
        <path d="M96 96c4-4 9-4 13 0m22 0c4-4 9-4 13 0" fill="none" stroke="#41352f" stroke-linecap="round" stroke-width="4" />
        <circle cx="101" cy="108" r="5" fill="#e99487" opacity=".7" />
        <circle cx="140" cy="108" r="5" fill="#e99487" opacity=".7" />
        <path d="M107 119c7 9 19 9 26 0" fill="none" stroke="#a84e53" stroke-linecap="round" stroke-width="4" />
        <path d="m184 39 4 9 10 1-8 6 3 10-9-6-8 6 3-10-8-6 10-1z" fill="#e2ae43" />
        <path d="m54 65 3 6 7 1-5 4 2 7-7-4-6 4 2-7-6-4 7-1z" fill="#78a88b" />
      </svg>
      <p class="care-dialog-eyebrow">Väike meeldetuletus</p>
      <h2 id="careDialogTitle">Millal viimati <span>Sina</span> ise enda eest hoolitsesid?</h2>
      <button class="care-dialog-action" type="button">Vaatan hiljem</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
